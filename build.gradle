plugins { id 'xyz.jpenilla.run-paper' version '3.1.0' }
apply from: './gradle/plugin.gradle'
// 主菜单插件：全服统一的功能入口
//   - ESC 菜单里的「主菜单」按钮（Paper/Folia dialog + pause_screen_additions 标签）
//   - /cd 命令
//   - 手持时钟右键
// 其它插件通过 com.example.mainmenu.api 注册自己的功能，规范见 ./docs/dev/功能插件接入规范.md


dependencies {
    // 其它插件以 compileOnly files(rootProject.file('libs/MainMenu-mc26.3-plugin-1.10.1-beta.1.jar')) 依赖本插件来使用 API；
    compileOnly files(rootProject.file('libs/arcmenu-api-3.2.0.jar'))
    testImplementation "dev.folia:folia-api:${foliaApiVersion}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
